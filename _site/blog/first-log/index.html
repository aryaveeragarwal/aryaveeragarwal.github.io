  <!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:wght@400;600&display=swap">

<script>
  (function () {
    const saved = localStorage.getItem("theme");
    const isDark = saved === "dark";

    if (isDark) {
      document.documentElement.setAttribute("data-theme", "dark");
    }

    // Set checkbox state immediately
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.getElementById("themeToggle");
      if (toggle) {
        toggle.checked = isDark;
      }
    });
  })();
</script>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme.js" defer></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">Aryaveer Agarwal</a>

      <nav class="nav">
        <button class="nav-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links">
          <a href="/about/" >About</a>
          <a href="/projects/" >Projects</a>
          <a href="/blog/" class="active">Blog</a>
          <a href="/contact/" >Contact</a>
        </div>
      </nav>

      <label class="theme-switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider">
          <span class="icon moon">☾</span>
          <span class="icon sun">☀</span>
        </span>
      </label>
    </div>
  </header>

  <div class="page-wrapper">
    <main class="container">
      <p>This is the beginning of my documented engineering journey.</p>

<p>More soon.</p>

    </main>

    <footer class="site-footer">
      <div class="container">
        Built deliberately. Updated frequently.<br>
        © 2026 Aryaveer Agarwal
      </div>
    </footer>
  </div>

</body>
</html>
