  <!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:wght@400;600&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme.js" defer></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg">

<body>

  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">{{ site.title }}</a>

      <nav class="nav">
        <button class="nav-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links">
          <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
          <a href="/projects/" {% if page.url == "/projects/" %}class="active"{% endif %}>Projects</a>
          <a href="/blog/" {% if page.url contains "/blog" %}class="active"{% endif %}>Blog</a>
          <a href="/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>Contact</a>
        </div>
      </nav>

      <label class="theme-switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider">
          <span class="icon moon">☾</span>
          <span class="icon sun">☀</span>
        </span>
      </label>
    </div>
  </header>

  <div class="page-wrapper">
    <main class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        Built deliberately. Updated frequently.<br>
        © {{ site.time | date: "%Y" }} {{ site.title }}
      </div>
    </footer>
  </div>

</body>
</html>
