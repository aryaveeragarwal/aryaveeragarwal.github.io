
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="logo">{{ site.title }}</a>
    <nav>
      <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
      <a href="/about/" {% if page.url == "/about/" %}class="active"{% endif %}>About</a>
      <a href="/projects/" {% if page.url == "/projects/" %}class="active"{% endif %}>Projects</a>
      <a href="/blog/" {% if page.url contains "/blog" %}class="active"{% endif %}>Blog</a>
      <a href="/contact/" {% if page.url == "/contact/" %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    © {{ site.time | date: "%Y" }} {{ site.title }}
  </div>
</footer>

</body>
</html>
