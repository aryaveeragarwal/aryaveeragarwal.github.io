---
layout: default
---

<article class="post">

  <a href="/blog/" class="post-back">← Blog</a>

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

</article>

<style>
  .post {
    max-width: 720px;
  }

  /* Back to blog */
  .post-back {
    display: inline-block;
    margin-bottom: 2.5rem;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    text-decoration: none;
    color: var(--muted, #9a938a);
    position: relative;
    transition: color 0.15s ease;
  }
  .post-back:hover {
    color: var(--accent, #c8563c);
  }

  /* Header */
  .post-header {
    margin-bottom: 3rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border, rgba(236, 231, 221, 0.12));
  }
  .post-title {
    margin: 0 0 0.6rem 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 4vw, 2.6rem);
    line-height: 1.15;
    color: var(--text, #ece7dd);
  }
  .post-date {
    display: block;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted, #9a938a);
  }

  /* Body */
  .post-body {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--text, #ece7dd);
  }
  .post-body > * + * {
    margin-top: 1.4rem;
  }
  .post-body h2 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.5rem;
    margin-top: 2.6rem;
  }
  .post-body h3 {
    font-size: 1.2rem;
    margin-top: 2rem;
  }
  .post-body a {
    color: var(--accent, #c8563c);
    text-underline-offset: 3px;
  }
  .post-body img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .post-body blockquote {
    margin-left: 0;
    padding-left: 1.2rem;
    border-left: 2px solid var(--border, rgba(236, 231, 221, 0.2));
    color: var(--muted, #9a938a);
    font-style: italic;
  }
  .post-body pre {
    overflow-x: auto;
    padding: 1rem;
    border-radius: 8px;
    background: var(--surface, rgba(255, 255, 255, 0.04));
    font-size: 0.9rem;
  }
</style>
